# Release of the module `planning` on a version tag (fs-release caller, pinned): ONE arch RPM `fs-module-planning` (kind module).
name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy-Net/fs-release/.github/workflows/release.yml@05a4a6a4e927931410d7ff262ac8f5af084f6766
    with:
      kind: module
      # `name` is the HOST module name (RPM = fs-module-planning), not the repo name; `binaries` is exactly the one service.
      name: planning
      binaries: fs-modules-planning
      cargo-package: fs-modules-planning
      # The test variant with a fixed owner (feature fake-owner) is never shipped.
      ignore-binaries: fs-modules-planning-fixed-owner
      macos: false
      windows-targets: ""
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
