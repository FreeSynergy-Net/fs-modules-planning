# The gate on the Windows runner of fs-release (windows-2022), as a caller of _windows-check.yml.
# Pin to a fs-release TAG that contains _windows-check.yml (v0.0.11 = first tag after the Opus look; never @main); `scripts/pin-refs.sh --dir <repo> <tag>` raises it. No secrets, so no `secrets: inherit`.
name: windows
on:
  push:
  workflow_dispatch:
    inputs:
      cache: { type: boolean, default: true, description: "Rust cache on; false = cold run (the evidence for a tag)" }

permissions:
  contents: read

jobs:
  windows:
    uses: FreeSynergy-Net/fs-release/.github/workflows/_windows-check.yml@baae80b411c0bbabfd04b83ccdee9368f5b457fd
    with:
      cache: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }} # push: cache on; by hand: the input above
    #   (more, optional)
    #   runner: windows-2022          # explicit, never *-latest
    #   packages: "fs-types fs-foo"   # -p each; default: --workspace
    #   features: "--all-features"    # default
    #   clippy-extra: "-W clippy::pedantic"
    #   no-fail-fast: true
