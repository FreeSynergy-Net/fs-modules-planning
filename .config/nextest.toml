# cargo-nextest profiles for fs-modules-planning (workflow testlauf, CLAUDE.md §4: little but often). Vorlage fs-components 216594c0.
# Geprüft mit `cargo nextest list` (C4 Batch 2). Muster: fs-rpc .config/nextest.toml.
# Stufen: quick (alles ausser CI-only) | release (nur CI, alles). Keine eindeutigen Namen für security/time/socket/platform/picture.

[profile.default]
fail-fast = false

[profile.quick]
fail-fast = true
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.release]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
