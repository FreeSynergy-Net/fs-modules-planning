[package]
name = "fs-tasks-sample"
description = "Fixed sample data of the planning module: three example tasks and a mini plan as JSCalendar Tasks, the people from the person-directory sample"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
fs-tasks-core = { path = "../fs-tasks-core", version = "0.0.6" }
# The people: the ONE sample of the person directory (names, references, addresses), the same fs-interfaces source and fs-types as the module.
fs-person-directory = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "92dbb53e9c9ea2c48e85a27712f0456f2a7b8161", version = "0.3.0" }
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
# Only the tests use it (`Dur::parse`).
fs-jscalendar = { git = "https://github.com/FreeSynergy-Net/fs-jscalendar", rev = "0a3add97339c92be0ab8b524a294ca44ee8dca25", version = "0.0.7" }
