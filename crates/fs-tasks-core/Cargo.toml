[package]
name = "fs-tasks-core"
description = "Program core of FreeSynergy tasks: JSCalendar 2.0 Task over fs-objects behind the TaskItems interface, RFC 9253 relations, iCalendar VTODO"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Cap'n Proto contract: the schema and generated code live in fs-interfaces (ADR 0045).
contract = ["dep:capnp"]

[dependencies]
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "f6409f2a5378ba1464e69ae216efd4d27d249182", version = "0.0.11" }
# The hand order of the cards of a board: a rank key per card (fractional index), never a position number.
fs-rank = { path = "../fs-rank" }
# Shared JSCalendar types (time, rule, participants, upgrade, validation, iCalendar); Task itself is ours (ADR 0050).
fs-jscalendar = { git = "https://github.com/FreeSynergy-Net/fs-jscalendar", tag = "v0.0.7" }
# CSS color names for the member `color` (RFC 8984 4.2.11), checked on write; MIT OR Apache-2.0.
csscolorparser = { version = "0.9", default-features = false, features = ["named-colors"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
capnp = { version = "0.27", optional = true }
# The contract and the provider rule (ADR 0045). The generated code is re-exported with feature `contract`.
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "e6f69213b68b47e139fc8038c8a095f9ed1fef3c", version = "0.2.0" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
# a store owner for the tests (`testing::owner()`, `testing::options()`)
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "f6409f2a5378ba1464e69ae216efd4d27d249182", version = "0.0.11", features = ["testing"] }
