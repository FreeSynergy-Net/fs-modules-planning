[package]
name = "fs-modules-planning-client"
description = "Client of the planning module: the board of tasks as the host needs it (columns, add card, move card, add column, what can be done), over the contract tasks.capnp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_modules_planning_client"

[dependencies]
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "7f76482563643fed450498c357b252164b6cfd62", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "7bbad2ff60017c809b83085a4c6b6cab16b9b605", version = "0.2.0" }
fs-jscalendar = { git = "https://github.com/FreeSynergy-Net/fs-jscalendar", tag = "v0.0.7" }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }

[dev-dependencies]
fs-modules-planning = { path = "../fs-modules-planning" }
fs-tasks-core = { path = "../fs-tasks-core" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "f6409f2a5378ba1464e69ae216efd4d27d249182", version = "0.0.11", features = ["testing"] }
tempfile = "3"
semver = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
