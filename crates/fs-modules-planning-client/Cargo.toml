[package]
name = "fs-modules-planning-client"
description = "Client of the planning module: the board of tasks as the host needs it (columns, add card, move card, add column, what can be done), over the contract tasks.capnp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_modules_planning_client"

[dependencies]
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "56f5cc399bbbb566f74d59d4c5b76005ce653697", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "83b96e30ae3f8a04a222fa5a34dc4ad29306cdf2", version = "0.2.0" }
fs-jscalendar = { git = "https://github.com/FreeSynergy-Net/fs-jscalendar", rev = "0a3add97339c92be0ab8b524a294ca44ee8dca25", version = "0.0.7" }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }

[dev-dependencies]
fs-modules-planning = { path = "../fs-modules-planning", version = "0.0.4" }
fs-tasks-core = { path = "../fs-tasks-core", version = "0.0.4" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11", features = ["testing"] }
tempfile = "3"
semver = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
