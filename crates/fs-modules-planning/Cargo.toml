[package]
name = "fs-modules-planning"
description = "The planning module service of FreeSynergy: one process per person, the contract tasks.capnp (items, boards) on a Unix socket, the actor from the connection only"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_modules_planning"

[[bin]]
name = "fs-modules-planning"
path = "src/main.rs"

# The same program with a fixed owner (`FixedOwner`) for the tests that run it as a process; never part of a build without the feature.
[[bin]]
name = "fs-modules-planning-fixed-owner"
path = "src/bin_fixed_owner.rs"
required-features = ["fake-owner"]

[[test]]
name = "process"
required-features = ["fake-owner"]

[features]
fake-owner = ["fs-interfaces/fake"]

[dependencies]
# The core is used without its `contract` feature: the service needs none of its filter conversion.
fs-tasks-core = { path = "../fs-tasks-core", version = "0.0.5" }
# The one place of the module name (socket, catalog, data folder): the client says it, the service uses it.
fs-modules-planning-client = { path = "../fs-modules-planning-client", version = "0.0.5" }
# One source per library: the same tags as the core and fs-rpc (v0.1.3 has fs-interfaces v0.1.0).
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "0f639470a7c1e5bbae5f84fbbbb41bf2504c232a", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "ad56e2f4b953ebf51d41bb7aec8202dfafebdfac", version = "0.2.0" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
# The owner is the person "me" of the module person (ADR 0104 E9), asked from its service and never made up. One source per library: it pins the same fs-rpc, fs-interfaces, fs-objects and fs-types.
fs-person-service = { git = "https://github.com/FreeSynergy-Net/fs-modules-person", rev = "157f10ca734c04ce05664f2821ca2aa2e3674815", version = "0.0.1", features = ["client"] }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"
uuid = "1"
# `BasicValue::canonical`: the text of the person reference of a change.
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }

[dev-dependencies]
# Fixed and missing owners for the tests (`FixedOwner`, `NoOwner`) and a store owner (`testing::owner()`).
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "ad56e2f4b953ebf51d41bb7aec8202dfafebdfac", version = "0.2.0", features = ["fake"] }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11", features = ["testing"] }
# The conformance suite of the contract `module_v1` (fixture trait, rules), the same fs-interfaces source as above.
fs-module = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "ad56e2f4b953ebf51d41bb7aec8202dfafebdfac", version = "0.2.0" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }