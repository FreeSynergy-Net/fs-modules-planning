[package]
name = "fs-modules-planning"
description = "The planning module service of FreeSynergy: one process per person, the contract tasks.capnp (items, boards) on a Unix socket, the actor from the connection only"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_modules_planning"

[[bin]]
name = "fs-modules-planning"
path = "src/main.rs"

# The same program with a fixed owner (`FixedOwner`) for the tests that run it as a process; never part of a build without the feature.
[[bin]]
name = "fs-modules-planning-fixed-owner"
path = "src/bin_fixed_owner.rs"
required-features = ["fake-owner"]

[[test]]
name = "process"
required-features = ["fake-owner"]

[features]
fake-owner = ["fs-interfaces/fake"]

[dependencies]
# The core is used without its `contract` feature: the service needs none of its filter conversion.
fs-tasks-core = { path = "../fs-tasks-core" }
# The one place of the module name (socket, catalog, data folder): the client says it, the service uses it.
fs-modules-planning-client = { path = "../fs-modules-planning-client" }
# One source per library: the same tags as the core and fs-rpc (v0.1.3 has fs-interfaces v0.1.0).
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "d8944ef9f446956e2d86942cafd656519d3abdea", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "e6f69213b68b47e139fc8038c8a095f9ed1fef3c", version = "0.2.0" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "f6409f2a5378ba1464e69ae216efd4d27d249182", version = "0.0.11" }
# The owner is the person "me" of the module person (ADR 0104 E9), asked from its service and never made up. One source per library: it pins the same fs-rpc, fs-interfaces, fs-objects and fs-types.
fs-person-service = { git = "https://github.com/FreeSynergy-Net/fs-modules-person", rev = "47d33854fc3e9d4dc9e19ba18ef4fcc2682154c2", version = "0.0.1", features = ["client"] }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"
uuid = "1"
# `BasicValue::canonical`: the text of the person reference of a change.
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", tag = "v0.0.6", version = "0.0.5" }
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }

[dev-dependencies]
# Fixed and missing owners for the tests (`FixedOwner`, `NoOwner`) and a store owner (`testing::owner()`).
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "e6f69213b68b47e139fc8038c8a095f9ed1fef3c", version = "0.2.0", features = ["fake"] }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "f6409f2a5378ba1464e69ae216efd4d27d249182", version = "0.0.11", features = ["testing"] }
# The conformance suite of the contract `module_v1` (fixture trait, rules), the same fs-interfaces source as above.
fs-module = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "e6f69213b68b47e139fc8038c8a095f9ed1fef3c", version = "0.2.0" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }