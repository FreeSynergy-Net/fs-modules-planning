[package]
name = "fs-modules-planning"
description = "The planning module service of FreeSynergy: one process per person, the contract tasks.capnp (items, boards) on a Unix socket, the actor from the connection only"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_modules_planning"

[[bin]]
name = "fs-modules-planning"
path = "src/main.rs"

[dependencies]
# The contract here is the one of fs-interfaces main (Boards), so the core is used WITHOUT its own `contract` feature (it is built on the tag v0.0.22).
fs-tasks-core = { path = "../fs-tasks-core" }
# One source per library: the tags fs-rpc itself pins (fs-interfaces is patched to its main head, see the workspace Cargo.toml).
fs-rpc = { git = "https://github.com/FreeSynergy/fs-rpc", tag = "v0.0.3" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.28" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }