[package]
name = "fs-modules-planning"
description = "The planning module service of FreeSynergy: one process per person, the contract tasks.capnp (items, boards) on a Unix socket, the actor from the connection only"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_modules_planning"

[[bin]]
name = "fs-modules-planning"
path = "src/main.rs"

[dependencies]
# The core is used without its `contract` feature: the service needs none of its filter conversion.
fs-tasks-core = { path = "../fs-tasks-core" }
# One source per library: the same tags as the core and fs-rpc.
fs-rpc = { git = "https://github.com/FreeSynergy/fs-rpc", tag = "v0.0.6" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.30" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.8" }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }